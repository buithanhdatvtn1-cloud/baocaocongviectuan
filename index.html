                <h2 class="text-xl font-bold tracking-wide">ĐÀI VIỄN THÔNG NGHỆ AN</h2>
                <p class="text-[11px] text-blue-100 uppercase tracking-widest mt-1 font-medium">Hệ Thống Quản Lý Báo Cáo Công Việc</p>
            </div>
            
            <form id="loginForm" class="p-6 space-y-4">
                <div id="loginError" class="hidden p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-xs rounded">
                    <i class="fas fa-exclamation-circle mr-1"></i> Tài khoản hoặc mật khẩu không chính xác!
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Tài khoản Cán bộ</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <i class="fas fa-user-circle"></i>
                        </span>
                        <select id="loginUser" required class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-vnpt focus:border-vnpt text-xs font-semibold text-gray-700">
                            <option value="" disabled selected>-- Chọn tài khoản cán bộ --</option>
                            <option value="tvkhoa">tvkhoa</option>
                            <option value="nhmai">nhmai</option>
                            <option value="chiennv3">chiennv3</option>
                            <option value="ndnguyen">ndnguyen</option>
                            <option value="nguyenvancuong1">nguyenvancuong1</option>
                            <option value="phanthanhha1">phanthanhha1</option>
                            <option value="ththanh">ththanh</option>
                            <option value="btdat">btdat</option>
                            <option value="tkt.nan">tkt.nan</option>
                            <option value="nhquang">nhquang</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Mật khẩu</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" id="loginPass" required placeholder="Nhập mật khẩu..." class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-vnpt focus:border-vnpt text-xs">
                    </div>
                </div>
                <button type="submit" class="w-full bg-vnpt hover:bg-vnpt-dark text-white font-bold py-3 rounded-xl shadow-lg hover:shadow-xl transition duration-200 flex justify-center items-center gap-2 text-xs uppercase tracking-wider">
                    <i class="fas fa-sign-in-alt"></i> Đăng nhập Hệ Thống
                </button>
            </form>
            <div class="bg-gray-50 px-6 py-3 border-t text-center text-[11px] text-gray-500">
                Tập đoàn Bưu chính Viễn thông Việt Nam &copy; 2026
            </div>
        </div>
    </div>
